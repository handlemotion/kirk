name: Set up pnpm and Node
description: Installs pnpm and Node, restores the pnpm store cache and installs dependencies.

inputs:
  install:
    description: Run pnpm install --frozen-lockfile.
    default: "true"

runs:
  using: composite
  steps:
    # Reads the pnpm version from packageManager in package.json.
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    # Reads the Node version from .node-version. That file is the only place
    # the version is set.
    - uses: actions/setup-node@v7
      with:
        node-version-file: .node-version
        cache: pnpm

    # Fails when pnpm-lock.yaml and package.json disagree.
    - if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
