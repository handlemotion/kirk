name: Desktop build

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "packages/shared/**"
      - "convex/**"
      - ".github/workflows/desktop-build.yml"
  push:
    paths:
      - "apps/desktop/**"
      - "packages/shared/**"
      - "convex/**"
      - ".github/workflows/desktop-build.yml"

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    env:
      # Dummy value. The build only needs it to be present.
      VITE_CONVEX_URL: https://example.convex.cloud
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # Package list from https://tauri.app/start/prerequisites/#linux
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - run: pnpm install --frozen-lockfile

      - name: Build (unsigned)
        run: pnpm --filter @kirk/desktop tauri build
